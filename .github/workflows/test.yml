name: Check and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Moon env (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Setup Moon env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -Encoding utf8 -FilePath $env:GITHUB_PATH -Append

      - name: Moon Update Registry
        run: |
          moon version --all
          moon update

      - name: Moon format
        run: |
          moon fmt --check

      - name: Moon check
        run: |
          moon check --target all
          moon check --deny-warn

      - name: Moon build
        run: |
          moon build

      - name: Moon test
        run: |
          moon test --target all
          moon test --deny-warn

      - name: Moon info
        run: |
          moon info
          # Moon toolchains may normalize trailing blank lines in generated interfaces.
          # Keep the check strict for actual interface changes while tolerating that
          # formatting-only difference across runner/toolchain versions.
          git diff --ignore-blank-lines --exit-code
          git status
